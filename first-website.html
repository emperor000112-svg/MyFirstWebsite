<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            padding: 40px;
            background: #1e293b;
            border-radius: 20px;
        }

        h1 {
            color: #22d3ee;
            font-size: 40px;
        }

        h2 {
            color: #38bdf8;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            background: #22d3ee;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0891b2;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Welcome to My Website 🚀</h1>

        <h2>Rajvardhan 👋</h2>

        <p>
            Hello! I am Rajvardhan.
            I am learning HTML, CSS and JavaScript.
        </p>

        <p>
            This is my first independent website project.
        </p>

       <button onclick="sayHello()">Click Me</button>

        <p id="message"></p>
    </div>

    
<script src="script.js"></script>
</body>
</html>
