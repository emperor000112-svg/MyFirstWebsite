<!DOCTYPE html>
<html>
<head>
    <title>My Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Calculator 🧮</h1>
    <input type="text" id="display" readonly>
    <br><br>

<button>7</button>
<button>8</button>
<button>9</button>
<button>+</button>

<br>

<button>4</button>
<button>5</button>
<button>6</button>
<button>-</button>

<br>

<button>1</button>
<button>2</button>
<button>3</button>
<button>*</button>

<br>
<button>.</button>
<button>0</button>
<button>⌫</button>
<button>C</button>
<button>=</button>
<button>/</button>
<script>
    let display = document.getElementById("display");
    let buttons = document.querySelectorAll("button");

    buttons.forEach(button => {
        button.addEventListener("click", () => {
            let value = button.innerText;

            if (value === "C") {
                display.value = "";
            } 
            else if (value === "=") {
                display.value = eval(display.value);
            } 
            else if (value === "⌫") {
                display.value = display.value.slice(0, -1);
            }
            else {
                display.value += value;
            }
        });
    });
    document.addEventListener("keydown", (event) => {
    const key = event.key;

   if (/[0-9.+\-*\/]/.test(key)) {
        display.value += key;
    }

    if (key === "Enter") {
        display.value = eval(display.value);
    }

    if (key === "Backspace") {
        display.value = display.value.slice(0, -1);
    }

    if (key === "Escape") {
        display.value = "";
    }
});
</script>
</body>
</html>
